<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Kuizz : quiz de révision (QCM, vrai/faux, flashcards).">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      var t = localStorage.getItem('kuizz:theme');
      if (t === 'light' || t === 'dark') {
        document.documentElement.setAttribute('data-theme', t);
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', t);
      }
    } catch (e) { /* stockage bloqué : on suit le système */ }
  </script>
  <title>Kuizz</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='8'%20fill='%232c4bd6'/%3E%3Cpath%20d='M9%2016.5l4.5%204.5L23%2011'%20fill='none'%20stroke='white'%20stroke-width='3.5'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&amp;display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">Aller au contenu</a>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="#/">Kuizz</a>
      <button class="theme-toggle" type="button" data-target="dark" hidden>
        <svg class="icon-moon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="theme-toggle-label sr-only">Passer au thème sombre</span>
      </button>
    </div>
  </header>
  <main id="app" class="container" tabindex="-1">
    <p>Chargement…</p>
    <noscript><p>Kuizz a besoin de JavaScript pour fonctionner.</p></noscript>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>Kuizz · quiz de révision · ta progression est enregistrée sur cet appareil uniquement.</p>
    </div>
  </footer>
  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
