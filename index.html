THESIS: Le quiz comme revue de code : chaque question est un check, chaque erreur un commentaire de revue avec le correctif en diff. Refuse la carte de quiz arrondie pastel et le papier crème.
OWN-WORLD: Fond « revue » gris-blanc froid / graphite en sombre, encre quasi noire ; vert et rouge réservés au verdict sous forme de lignes de diff teintées avec gouttière +/− ; une couleur d'action indigo électrique ; pastilles de statut ✓ ✗ ● en monospace ; filets fins, coins serrés, commentaires ancrés par un rail vertical.
STORY: L'étudiant voit ses modules comme des dépôts avec l'état de leurs checks, ouvre un quiz, répond ; une erreur s'affiche en check échoué suivi d'un commentaire de revue « − ta réponse / + la bonne » et du pourquoi ; à la fin, il relance les checks échoués.
FIRST VIEWPORT: Barre d'en-tête (marque Kuizz + bouton de thème) ; titre « Mes révisions » ; premier module en bloc de dépôt : nom en monospace, puis une ligne par quiz avec titre, méta mono et pastilles d'état ; la ligne entière est le lien.
FORM: Revue de PR / checks de CI, n°5 de la liste ancrée, seed 57ed3e1a.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
